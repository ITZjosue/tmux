#Better prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# vi mode
set -g mode-keys vi

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1

# True colors support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Status bar
set -g status-style bg=default,fg=black,bright
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

#Windows buttons
set -g window-status-format "#[fg=brightblack,nobold] #{b:pane_current_path} "
set -g window-status-current-format "#{?window_zoomed_flag,#[fg=yellow],#[fg=white]}#[bold] #{b:pane_current_path} "
set -g status-interval 1

set -g window-status-bell-style "fg=magenta,nobold"

#Options
set -g renumber-windows on 

#Pane separators
set -g pane-border-lines double
set -g pane-border-style fg="#444444"
set -g pane-active-border-style fg="#00afff"

#QoL
set -g escape-time 0
set -g mouse on
set -g repeat-time 1000
set -g history-limit 10000

#Keybindings 
bind | split-window -h -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

bind v split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind f resize-pane -Z

bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

set-option -g status-position top
